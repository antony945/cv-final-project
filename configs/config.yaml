# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
#  LeJEPA Pre-training — Base Configuration
#  Override with: +experiment=pretrain_test, +experiment=pretrain_local, etc.
#  CLI overrides: uv run python -m src.main epochs=100 bs=32
# ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

# ── Task ───────────────────────────────────────────────────────────────
task: pretrain # pretrain | finetune

# ── Model ──────────────────────────────────────────────────────────────
variant: xxs # xxs (0.71M) | xs (1.45M) | s (3.29M)
device: auto # auto | cpu | cuda
compile: false # torch.compile for faster training (requires CUDA)

# ── Data ───────────────────────────────────────────────────────────────
data:
  use_mmap: false # use memory-mapped .npy files (run src.preprocess first)
  datasets: {} # declared per experiment (nyu, kitti, or both)
  # Each dataset entry expects:
  #   n_samples: int       — number of training images to load
  #   depth_shift: float   — D-shift augmentation range in meters (e.g. 0.1 indoor, 1.0 outdoor)
  #   min_depth: float     — minimum valid depth for evaluation (m)
  #   max_depth: float     — maximum valid depth for evaluation (m)
  #   eval_crop: str       — evaluation crop mode ("none" for NYU, "eigen" for KITTI)

# ── LeJEPA Pre-training ────────────────────────────────────────────────
epochs: 50
bs: 64 # batch size (images per step)
lr: 2e-3 # learning rate (scale with BS: lr = 2e-3 × bs/256)
weight_decay: 0.05 # AdamW weight decay — minimal example uses 5e-2
lr_min: 0.001 # cosine annealing floor (eta_min) — how low lr decays to
lamb: 0.02 # λ — SIGReg weight (the only LeJEPA hyperparameter)
n_views: 4 # augmented views per image
proj_dim: 16 # projector output dim (paper recommends 16)
resolution: 128 # square crop size for SSL pre-training

# ── Checkpointing ─────────────────────────────────────────────────────
ckpt_every: 10 # save backbone weights every N epochs

# ── METER Fine-tuning (depth estimation) ──────────────────────────────
finetune:
  resolution: [192, 256] # [H, W] — official METER NYU resolution
  epochs: 60
  bs: 128
  lr: 0.001
  weight_decay: 0.01
  lr_step_size: 20 # StepLR: ×gamma every N epochs
  lr_gamma: 0.1
  lamb1: 0.5 # gradient loss weight
  lamb2: 1.0 # normal loss weight
  lamb3: 1.0 # SSIM loss weight
  depth_bias: 3.0 # decoder output bias init (mean depth: 3.0 for NYU, 15.0 for KITTI)
  freeze_encoder_epochs: 0 # 0 = train end-to-end from start
  pretrained_encoder: null # path to LeJEPA checkpoint (optional)
  resume: null # path to full checkpoint for resume training

# ── Experiment tracking ────────────────────────────────────────────────
use_wandb: false
wandb_project: lejepa-meter

# ── Hydra output directory ─────────────────────────────────────────────
defaults:
  - _self_
  - override hydra/job_logging: default

hydra:
  job:
    chdir: true
  run:
    dir: outputs/${task}/${variant}_${now:%Y-%m-%d_%H-%M-%S}
  sweep:
    dir: outputs/multirun/${now:%Y-%m-%d_%H-%M-%S}
