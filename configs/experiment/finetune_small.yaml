# @package _global_
# Small fine-tuning run — 1000 samples, bs=16, 60 epochs (~3750 updates)
# Usage: uv run python -m src.main +experiment=finetune_small

task: finetune
variant: xxs

data:
  dataset: nyu
  n_samples: 1000

finetune:
  resolution: [192, 256]
  epochs: 60
  bs: 16
  lr: 0.001
  weight_decay: 0.01
  lr_step_size: 20
  lr_gamma: 0.1
  lamb1: 0.5
  lamb2: 1.0
  lamb3: 1.0
  freeze_encoder_epochs: 0
  pretrained_encoder: null
  val_every: 5

ckpt_every: 5
use_wandb: false
