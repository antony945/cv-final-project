# @package _global_
# Full production run — ~2h on A100
# Usage: uv run python -m src.main +experiment=pretrain_production_kitti

task: pretrain
variant: xxs
compile: true

data:
  use_mmap: true
  datasets:
    kitti:
      n_samples: 22285 # Eigen train ~23k valid pairs
      depth_shift: 1.0
      min_depth: 0.001
      max_depth: 80.0
      eval_crop: eigen

epochs: 300 # paper doesnt suggest number of epochs, but minimal example use up to 800
bs: 128 # suggested by original paper, can go also to 256
lr: 2e-3 # learning rate (scale with BS: lr = 2e-3 × bs/256)
weight_decay: 0.05 # AdamW weight decay — minimal example uses 5e-2
lr_min: 0.001 # cosine annealing floor (eta_min)

lamb: 0.02 # sigreg weight, paper suggest 0.05, minimal example in the same report suggests 0.02
n_views: 8 # augmented views per image, paper divides those into globlal and local, suggesting 2 and 6 respectively = 8, but minimal example suggests 4 mixed views
proj_dim: 16 # projector output dim (paper recommends that even with just 16 yields good results)
resolution: 128 # square crop size for SSL pre-training, paper suggest resolution 224x224 for global views and 96x96 for local views, but minimal example suggests 128x128 for all views

ckpt_every: 20
use_wandb: true
