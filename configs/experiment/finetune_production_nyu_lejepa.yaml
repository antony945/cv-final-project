# @package _global_
# Full METER fine-tuning on NYU Depth V2 with LeJEPA pretrained encoder
# Usage: uv run python -m src.main +experiment=finetune_production_nyu_lejepa

task: finetune
variant: xxs
compile: true

data:
  use_mmap: true
  datasets:
    nyu:
      n_samples: 50000 # 47584 full NYU training set
      depth_shift: 0.1
      min_depth: 0.001
      max_depth: 10.0
      eval_crop: none

finetune:
  resolution: [192, 256]
  epochs: 60
  bs: 128
  lr: 0.001
  weight_decay: 0.01
  lr_step_size: 20
  lr_gamma: 0.1
  lamb1: 0.5
  lamb2: 1.0
  lamb3: 1.0
  depth_bias: 3.0 # indoor scenes (NYU)
  freeze_encoder_epochs: 0
  pretrained_encoder: models/lejepa_xxs_mix_300_44k_128.pth # path to LeJEPA pretrained encoder checkpoint

ckpt_every: 5
use_wandb: true
