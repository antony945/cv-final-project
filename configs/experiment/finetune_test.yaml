# @package _global_
# Quick fine-tuning sanity test — ~2 min on any hardware
# Usage: uv run python -m src.main +experiment=finetune_test

task: finetune
variant: xxs
compile: true

data:
  use_mmap: true
  use_cache: false
  datasets:
    nyu:
      n_samples: 100
      depth_shift: 0.1

finetune:
  resolution: [192, 256]
  epochs: 100
  bs: 16
  lr: 0.001
  weight_decay: 0.01
  lr_step_size: 20
  lr_gamma: 0.1
  lamb1: 0.5
  lamb2: 1.0
  lamb3: 1.0
  freeze_encoder_epochs: 0
  pretrained_encoder: null

ckpt_every: 5
use_wandb: false
