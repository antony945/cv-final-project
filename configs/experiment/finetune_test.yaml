# @package _global_
# Quick fine-tuning sanity test — ~2 min on any hardware
# Usage: uv run python -m src.main +experiment=finetune_test

task: finetune
variant: xxs
compile: true

data:
  dataset: nyu
  n_samples: 50
  use_cache: false

finetune:
  resolution: [192, 256]
  epochs: 2
  bs: 4
  lr: 0.001
  weight_decay: 0.01
  lr_step_size: 20
  lr_gamma: 0.1
  lamb1: 0.5
  lamb2: 1.0
  lamb3: 1.0
  freeze_encoder_epochs: 0
  pretrained_encoder: null
  val_every: 2

ckpt_every: 2
use_wandb: false
