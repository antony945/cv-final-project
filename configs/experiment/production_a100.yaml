# @package _global_
# Full production run optimized for A100 — ~2h
# Usage: uv run python -m src.main +experiment=production_a100

epochs: 200
bs: 256
lr: 2e-3 # full LR at paper-scale batch size
compile: true
data:
  n_samples: 47584 # full NYU Depth V2 train set
  use_cache: false
  use_mmap: true
ckpt_every: 25
use_wandb: true
