# @package _global_
# Moderate fine-tuning run — ~30 min on local GPU
# Usage: uv run python -m src.main +experiment=finetune_local

task: finetune
variant: xxs
compile: true

data:
  use_mmap: true
  use_cache: false
  datasets:
    nyu:
      n_samples: 10000
      depth_shift: 0.1

finetune:
  resolution: [192, 256]
  epochs: 60
  bs: 128
  lr: 0.001
  weight_decay: 0.01
  lr_step_size: 20
  lr_gamma: 0.1
  lamb1: 0.5
  lamb2: 1.0
  lamb3: 1.0
  freeze_encoder_epochs: 0
  pretrained_encoder: null

ckpt_every: 5
use_wandb: true
