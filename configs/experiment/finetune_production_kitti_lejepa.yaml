# @package _global_
# Full METER fine-tuning on KITTI (Eigen split)
# Usage: uv run python -m src.main +experiment=finetune_production_kitti

task: finetune
variant: xxs
compile: true

data:
  use_mmap: true
  use_cache: false
  datasets:
    kitti:
      n_samples: 50000 # Eigen train: ~23k valid pairs
      depth_shift: 1.0 # D-shift augmentation range (±1m outdoor)
      resolution: [192, 640] # H x W (wide aspect ratio)
      min_depth: 0.001 # min valid depth for evaluation (m)
      max_depth: 80.0 # max valid depth for evaluation (m) — standard KITTI cap
      eval_crop: eigen # Eigen crop for KITTI evaluation

finetune:
  resolution: [192, 640]
  epochs: 60
  bs: 64 # smaller batch due to wider images (more GPU memory)
  lr: 0.001
  weight_decay: 0.01
  lr_step_size: 20
  lr_gamma: 0.1
  lamb1: 0.5
  lamb2: 1.0
  lamb3: 1.0
  depth_bias: 10.0 # outdoor scenes have larger average depth
  freeze_encoder_epochs: 0
  pretrained_encoder: models/lejepa_xxs_mix_300_44k_128.pth # set to checkpoint path for transfer

ckpt_every: 5
use_wandb: true
