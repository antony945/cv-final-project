# @package _global_
# Full METER fine-tuning on NYU Depth V2
# Usage: uv run python -m src.main +experiment=finetune_production

task: finetune
variant: xxs
compile: true

data:
  dataset: nyu
  n_samples: 47584 # full NYU training set
  use_cache: false
  use_mmap: true

finetune:
  resolution: [192, 256]
  epochs: 60
  bs: 128
  lr: 0.001
  weight_decay: 0.01
  lr_step_size: 20
  lr_gamma: 0.1
  lamb1: 0.5
  lamb2: 1.0
  lamb3: 1.0
  freeze_encoder_epochs: 0
  pretrained_encoder: null # set to checkpoint path for transfer

ckpt_every: 5
use_wandb: true
