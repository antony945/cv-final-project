[project]
name = "cv-final-project"
version = "0.1.0"
description = "LeJEPA pre-training for METER (MobileViT) monocular depth estimation"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "einops>=0.8.0",
    "h5py>=3.16.0",
    "hydra-core>=1.3.0",
    "matplotlib>=3.10.9",
    "numpy>=2.0.0",
    "omegaconf>=2.3.0",
    "pillow>=12.2.0",
    "python-dotenv>=1.2.2",
    "scikit-learn>=1.5.0",
    "torch>=2.4.0",
    "torchvision>=0.19.0",
    "tqdm>=4.66.0",
    "wandb>=0.17.0",
]

[tool.uv]
find-links = ["https://download.pytorch.org/whl/cu128"]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }
